server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/eventmaster_db
spring.datasource.username=user
spring.datasource.password=password
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
management.endpoint.health.show-details=always

# --- Konfiguracja Konsumenta Kafki ---
spring.kafka.consumer.group-id=eventmaster-command-handlers
spring.kafka.consumer.auto-offset-reset=earliest
# Użyjemy JSON Deserializera
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

# Kluczowe: musimy powiedzieć deserializerowi, jakich klas oczekuje
spring.kafka.consumer.properties.spring.json.trusted.packages=com.eventmaster.backend.events.command
spring.kafka.consumer.properties.spring.json.value.default.type=com.eventmaster.backend.events.command.CreateEventCommand
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/eventmaster

# --- Kafka ---
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
